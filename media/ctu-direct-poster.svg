<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f8f9f4"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="96" y="78" font-size="28" fill="#657b80">PLC 应用技术 · 微动画 15</text>
    <text x="96" y="190" font-size="68" font-weight="700" fill="#183c45">PLC上升沿检测CTU直接计数</text>
    <text x="96" y="260" font-size="34" fill="#657b80">CU 直接接输入：上升沿加 1，下降沿不计数</text>
    <rect x="96" y="330" width="1320" height="460" rx="28" fill="#fff" stroke="#dfe7e2" stroke-width="4"/>
    <text x="150" y="405" font-size="32" fill="#dc6430">输入 I0.0 / CTU.CU</text>
    <path d="M300 520H470V430H720V520H910V430H1160V520H1360" stroke="#dc6430" stroke-width="12" fill="none" stroke-linejoin="round"/>
    <text x="480" y="470" font-size="28" fill="#008579">↑ 上升沿</text>
    <text x="730" y="570" font-size="28" fill="#527da0">↓ 下降沿：不计数</text>
    <text x="150" y="670" font-size="32" fill="#008579">0→1 上升沿：计数 +1</text>
    <text x="150" y="725" font-size="32" fill="#527da0">1→0 下降沿：计数保持</text>
    <rect x="1480" y="330" width="344" height="460" rx="28" fill="#e9f0f5" stroke="#cbdbe3" stroke-width="4"/>
    <text x="1652" y="420" text-anchor="middle" font-size="30" fill="#657b80">计数值</text>
    <circle cx="1652" cy="540" r="100" fill="#e4f3ec"/>
    <text x="1652" y="575" text-anchor="middle" font-size="100" font-weight="600" fill="#008579">2</text>
    <text x="1652" y="700" text-anchor="middle" font-size="28" fill="#657b80">共计 2 次</text>
    <rect x="96" y="875" width="1728" height="115" rx="20" fill="#183c45"/>
    <text x="960" y="948" text-anchor="middle" font-size="38" fill="#fff">不需要额外脉冲线：把输入直接接到 CTU.CU</text>
  </g>
</svg>
