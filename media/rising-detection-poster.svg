<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f8f9f4"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="96" y="70" font-size="25" fill="#657b80">PLC 应用技术</text>
    <text x="1824" y="70" text-anchor="end" font-size="25" fill="#657b80">微动画 07 / 15 秒</text>
    <text x="96" y="157" font-size="54" font-weight="700" fill="#183c45">上升沿检测</text>
    <path d="M96 199H1824" stroke="#dfe7e2" stroke-width="2"/>
    <text x="250" y="277" text-anchor="middle" font-size="33" fill="#183c45">按钮</text>
    <rect x="151" y="424" width="198" height="131" rx="26" fill="#dde7e0" stroke="#c2d3c9" stroke-width="2"/>
    <ellipse cx="250" cy="430" rx="84" ry="29" fill="#a9bdb1"/>
    <rect x="172" y="365" width="156" height="69" rx="12" fill="#dc6430"/>
    <ellipse cx="250" cy="365" rx="78" ry="30" fill="#dc6430"/>
    <circle cx="250" cy="510" r="11" fill="#008579"/>
    <text x="250" y="636" text-anchor="middle" font-size="38" fill="#dc6430">按下</text>
    <text x="250" y="690" text-anchor="middle" font-size="29" fill="#657b80">输入为 1</text>
    <path d="M383 424H465M453 415L465 424L453 433" fill="none" stroke="#dc6430" stroke-width="4"/>
    <text x="560" y="277" font-size="33" fill="#dc6430">输入电平</text>
    <text x="560" y="536" font-size="33" fill="#008579">上升沿输出</text>
    <path d="M560 430H700V340H1380" fill="none" stroke="#dc6430" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560 690H700V600H760V690H1380" fill="none" stroke="#008579" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560 340H1380M560 430H1380M560 600H1380M560 690H1380" stroke="#dfe7e2" stroke-width="1"/>
    <text x="530" y="351" text-anchor="end" font-size="30" fill="#657b80">1</text><text x="530" y="441" text-anchor="end" font-size="30" fill="#657b80">0</text>
    <text x="530" y="611" text-anchor="end" font-size="30" fill="#657b80">1</text><text x="530" y="701" text-anchor="end" font-size="30" fill="#657b80">0</text>
    <circle cx="700" cy="340" r="7" fill="#dc6430"/>
    <path d="M700 718V733H760V718" fill="none" stroke="#008579" stroke-width="3"/>
    <text x="730" y="777" text-anchor="middle" font-size="29" fill="#008579">1 个扫描周期</text>
    <text x="1380" y="828" text-anchor="end" font-size="27" fill="#657b80">时间 →</text>
    <text x="1640" y="277" text-anchor="middle" font-size="33" fill="#183c45">计数</text>
    <circle cx="1640" cy="465" r="133" fill="#e4f3ec"/>
    <text x="1640" y="521" text-anchor="middle" font-size="160" font-weight="600" fill="#008579">1</text>
    <text x="1640" y="633" text-anchor="middle" font-size="34" fill="#008579">共计 1 次</text>
    <rect x="96" y="880" width="1728" height="110" rx="18" fill="#183c45"/>
    <text x="960" y="949" text-anchor="middle" font-size="38" fill="#fff">输入从 0 变为 1 时，产生一个上升沿脉冲。</text>
    <text x="96" y="1041" font-size="26" fill="#657b80">教学慢放示意；1 拍 = 1 个扫描周期。</text>
