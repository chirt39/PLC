<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f8f9f4"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="96" y="70" font-size="25" fill="#657b80">PLC 应用技术</text>
    <text x="1824" y="70" text-anchor="end" font-size="25" fill="#657b80">微动画 09 / 30 秒</text>
    <text x="96" y="157" font-size="54" font-weight="700" fill="#183c45">上升沿与下降沿检测</text>
    <path d="M96 199H1824" stroke="#dfe7e2" stroke-width="2"/>
    <text x="250" y="277" text-anchor="middle" font-size="33" fill="#183c45">按钮</text>
    <rect x="151" y="424" width="198" height="131" rx="26" fill="#dde7e0" stroke="#c2d3c9" stroke-width="2"/>
    <ellipse cx="250" cy="430" rx="84" ry="29" fill="#a9bdb1"/>
    <rect x="172" y="365" width="156" height="69" rx="12" fill="#dc6430"/>
    <ellipse cx="250" cy="365" rx="78" ry="30" fill="#dc6430"/>
    <circle cx="250" cy="510" r="11" fill="#008579"/>
    <text x="250" y="636" text-anchor="middle" font-size="38" fill="#dc6430">按下</text>
    <text x="250" y="690" text-anchor="middle" font-size="29" fill="#657b80">输入为 1</text>
    <path d="M383 424H465M453 415L465 424L453 433" fill="none" stroke="#dc6430" stroke-width="4"/>
    <text x="560" y="277" font-size="33" fill="#dc6430">输入电平</text>
    <text x="560" y="516" font-size="31" fill="#008579">上升沿计数</text>
    <text x="560" y="696" font-size="31" fill="#527da0">下降沿计数</text>
    <path d="M560 430H700V340H1000V430H1380" fill="none" stroke="#dc6430" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560 600H700V530H760V600H1380" fill="none" stroke="#008579" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560 780H1000V710H1060V780H1380" fill="none" stroke="#527da0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560 340H1380M560 430H1380M560 530H1380M560 600H1380M560 710H1380M560 780H1380" stroke="#dfe7e2" stroke-width="1"/>
    <text x="530" y="351" text-anchor="end" font-size="30" fill="#657b80">1</text><text x="530" y="441" text-anchor="end" font-size="30" fill="#657b80">0</text>
    <text x="530" y="541" text-anchor="end" font-size="30" fill="#657b80">1</text><text x="530" y="611" text-anchor="end" font-size="30" fill="#657b80">0</text>
    <text x="530" y="721" text-anchor="end" font-size="30" fill="#657b80">1</text><text x="530" y="791" text-anchor="end" font-size="30" fill="#657b80">0</text>
    <circle cx="700" cy="340" r="7" fill="#dc6430"/><circle cx="1000" cy="430" r="7" fill="#dc6430"/>
    <text x="700" y="315" text-anchor="middle" font-size="28" fill="#dc6430">0→1</text><text x="1000" y="475" text-anchor="middle" font-size="28" fill="#527da0">1→0</text>
    <text x="1380" y="828" text-anchor="end" font-size="27" fill="#657b80">时间 →</text>
    <text x="1640" y="277" text-anchor="middle" font-size="33" fill="#183c45">每类边沿计数</text>
    <circle cx="1640" cy="465" r="133" fill="#e4f3ec"/>
    <text x="1640" y="500" text-anchor="middle" font-size="76" font-weight="600" fill="#008579">各 1 次</text>
    <text x="1640" y="570" text-anchor="middle" font-size="29" fill="#527da0">上升沿 · 下降沿</text>
    <rect x="96" y="880" width="1728" height="110" rx="18" fill="#183c45"/>
    <text x="960" y="949" text-anchor="middle" font-size="38" fill="#fff">先观察 0 → 1 的上升沿，再观察 1 → 0 的下降沿。</text>
    <text x="96" y="1041" font-size="26" fill="#657b80">前 15 秒：上升沿；后 15 秒：下降沿。</text>
  </g>
</svg>
